<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration</title>
</head>

<body>

  <h1>Administration — Président des Jeunes</h1>

  <p id="status">⏳ Chargement...</p>

  <input
    type="email"
    id="email"
    placeholder="E-mail administrateur"
  >

  <br><br>

  <input
    type="password"
    id="password"
    placeholder="Mot de passe"
  >

  <br><br>

  <button id="loginBtn" type="button">
    SE CONNECTER
  </button>

  <div id="dashboard" style="display:none;">

    <hr>

    <h2>🎉 Tableau de bord administrateur</h2>

    <p>✅ Connexion administrateur réussie.</p>

    <button id="logoutBtn" type="button">
      Se déconnecter
    </button>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://qktfqpsqmcrgtmauntfj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_45SBmGTiYtsCv5QEmYIovQ_WiAzSrCl";

    const status =
      document.getElementById("status");

    const loginBtn =
      document.getElementById("loginBtn");

    const dashboard =
      document.getElementById("dashboard");


    // Vérification de Supabase

    if (!window.supabase) {

      status.textContent =
        "❌ Supabase ne s'est pas chargé.";

    } else {

      const db =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );


      status.textContent =
        "✅ Supabase est prêt. Tu peux te connecter.";


      // BOUTON CONNEXION

      loginBtn.onclick = async function() {

        status.textContent =
          "⏳ Connexion en cours...";

        loginBtn.disabled = true;


        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;


        if (!email || !password) {

          status.textContent =
            "⚠️ Entre ton e-mail et ton mot de passe.";

          loginBtn.disabled = false;

          return;
        }


        try {

          const result =
            await db.auth.signInWithPassword({
              email: email,
              password: password
            });


          if (result.error) {

            status.textContent =
              "❌ " + result.error.message;

            loginBtn.disabled = false;

            return;
          }


          status.textContent =
            "✅ Connexion réussie !";


          dashboard.style.display =
            "block";


          loginBtn.style.display =
            "none";


          document.getElementById("email").style.display =
            "none";

          document.getElementById("password").style.display =
            "none";


        } catch (error) {

          status.textContent =
            "❌ Erreur : " + error.message;

          loginBtn.disabled = false;

          console.error(error);

        }

      };


      // DECONNEXION

      document
        .getElementById("logoutBtn")
        .onclick = async function() {

          await db.auth.signOut();

          location.reload();

        };

    }

  </script>

</body>
</html>

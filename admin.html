<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - Président des Jeunes</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #17211f;
    }

    header {
      background: #075e54;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      width: 94%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h2 {
      color: #075e54;
      margin-top: 0;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
      margin: 4px;
    }

    .primary {
      background: #075e54;
      color: white;
    }

    .danger {
      background: #c62828;
      color: white;
    }

    .secondary {
      background: #e4ecea;
      color: #075e54;
    }

    .status {
      padding: 13px;
      border-radius: 8px;
      background: #eef5f3;
      margin-bottom: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .stat {
      background: #e8f5f2;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .number {
      font-size: 38px;
      font-weight: bold;
      color: #075e54;
    }

    .candidate-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }

    .candidate {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      background: white;
    }

    .candidate img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      border-radius: 10px;
    }

    .candidate h3 {
      color: #075e54;
    }

    .votes {
      font-size: 32px;
      font-weight: bold;
      color: #075e54;
    }

    .lock {
      background: #fff3cd;
      padding: 13px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>Administration — Président des Jeunes</h1>
</header>

<main>

  <!-- ÉTAT DU SCRUTIN -->
  <div class="card">

    <h2>État du scrutin</h2>

    <div id="electionStatus" class="status">
      Chargement...
    </div>

  </div>


  <!-- ÉLECTEURS -->
  <div class="card">

    <h2>Électeurs inscrits</h2>

    <div class="stats">

      <div class="stat">

        <div>Nombre d'électeurs</div>

        <div
          id="voterCount"
          class="number"
        >
          0
        </div>

      </div>

    </div>

    <p>
      Les informations personnelles des électeurs ne sont pas affichées.
    </p>

  </div>


  <!-- GESTION DES CANDIDATS -->
  <div class="card">

    <h2>Gestion des candidats</h2>

    <div id="candidateLock" class="lock">
      Chargement...
    </div>

    <form id="candidateForm">

      <label>Nom et prénom</label>

      <input
        type="text"
        id="candidateName"
        placeholder="Nom et prénom"
        required
      >

      <label>Profession</label>

      <input
        type="text"
        id="candidateProfession"
        placeholder="Profession"
      >

      <label>Programme</label>

      <textarea
        id="candidateProgramme"
        placeholder="Programme du candidat"
      ></textarea>

      <label>Ambitions / motivation</label>

      <textarea
        id="candidateAmbition"
        placeholder="Ambitions et motivation"
      ></textarea>

      <label>Photo</label>

      <input
        type="file"
        id="candidatePhoto"
        accept="image/*"
      >

      <button
        type="submit"
        class="primary"
        id="saveButton"
      >
        AJOUTER LE CANDIDAT
      </button>

      <button
        type="button"
        class="secondary hidden"
        id="cancelButton"
      >
        ANNULER
      </button>

    </form>

  </div>


  <!-- CANDIDATS -->
  <div class="card">

    <h2>Candidats</h2>

    <div
      id="candidateList"
      class="candidate-grid"
    >
      Chargement...
    </div>

  </div>


  <!-- RÉSULTATS -->
  <div class="card">

    <h2 id="resultsTitle">
      Votes en direct
    </h2>

    <div
      id="resultsList"
      class="candidate-grid"
    >
      Chargement...
    </div>

  </div>

</main>


<script>

const SUPABASE_URL =
  "https://qktfqpsqmcrgtmauntfj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_45SBmGTiYtsCv5QEmYIovQ_WiAzSrCl";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let electionConfig = null;
let editingId = null;


/* =====================================================
   CHARGER LA CONFIGURATION
===================================================== */

async function loadElectionConfig() {

  const { data, error } =
    await db
      .from("election_config")
      .select("date_debut,date_fin")
      .order("id", { ascending: true })
      .limit(1)
      .single();

  if (error) {

    document.getElementById("electionStatus").innerHTML =
      "❌ Impossible de charger le scrutin.";

    return;

  }

  electionConfig = data;

  updateElectionStatus();

}


/* =====================================================
   ÉTAT DU SCRUTIN
===================================================== */

function updateElectionStatus() {

  if (!electionConfig) return;

  const now = new Date();

  const debut =
    new Date(electionConfig.date_debut);

  const fin =
    new Date(electionConfig.date_fin);


  const status =
    document.getElementById("electionStatus");

  const lock =
    document.getElementById("candidateLock");

  const form =
    document.getElementById("candidateForm");

  const title =
    document.getElementById("resultsTitle");


  /* AVANT LE SCRUTIN */

  if (now < debut) {

    status.innerHTML =
      "🟡 <strong>Scrutin fermé.</strong><br>" +
      "Ouverture : " +
      debut.toLocaleString("fr-FR");

    lock.innerHTML =
      "🟢 <strong>Gestion des candidats ouverte.</strong>";

    form.classList.remove("hidden");

    title.textContent =
      "Votes";

    return;
  }


  /* PENDANT LE SCRUTIN */

  if (now >= debut && now < fin) {

    status.innerHTML =
      "🟢 <strong>Scrutin ouvert.</strong><br>" +
      "Les votes sont actuellement enregistrés.";

    lock.innerHTML =
      "🔒 <strong>Gestion des candidats verrouillée.</strong>";

    form.classList.add("hidden");

    title.textContent =
      "🗳️ Votes en direct";

    return;
  }


  /* APRÈS LE SCRUTIN */

  status.innerHTML =
    "🔴 <strong>Scrutin clôturé.</strong><br>" +
    "Les résultats définitifs sont disponibles.";

  lock.innerHTML =
    "🔒 <strong>Scrutin terminé.</strong>";

  form.classList.add("hidden");

  title.textContent =
    "🏆 Résultats finaux";

}


/* =====================================================
   CHARGER LE NOMBRE D'ÉLECTEURS ET LES VOTES
===================================================== */

async function loadStats() {

  const { data, error } =
    await db.rpc("admin_dashboard_stats");


  if (error) {

    console.error(error);

    document.getElementById("voterCount")
      .textContent = "—";

    document.getElementById("resultsList").innerHTML =
      "<p>❌ Impossible de charger les résultats.</p>";

    return;

  }


  document.getElementById("voterCount")
    .textContent =
    data.electeurs_inscrits;


  const results =
    document.getElementById("resultsList");

  results.innerHTML = "";


  if (!data.resultats ||
      data.resultats.length === 0) {

    results.innerHTML =
      "<p>Aucun candidat.</p>";

    return;
  }


  data.resultats.forEach(item => {

    const card =
      document.createElement("div");

    card.className =
      "candidate";

    card.innerHTML = `

      <h3>
        ${escapeHtml(item.nom_prenom)}
      </h3>

      <div class="votes">
        ${item.votes}
      </div>

      <p>vote(s)</p>

    `;

    results.appendChild(card);

  });

}


/* =====================================================
   CHARGER LES CANDIDATS
===================================================== */

async function loadCandidates() {

  const { data, error } =
    await db
      .from("candidats")
      .select(
        "id,nom_prenom,photo_url,profession,programme,ambition"
      )
      .order("created_at", {
        ascending: true
      });


  const list =
    document.getElementById("candidateList");


  if (error) {

    list.innerHTML =
      "<p>❌ Impossible de charger les candidats.</p>";

    return;
  }


  list.innerHTML = "";


  if (!data || data.length === 0) {

    list.innerHTML =
      "<p>Aucun candidat enregistré.</p>";

    return;
  }


  data.forEach(candidate => {

    const card =
      document.createElement("div");

    card.className =
      "candidate";


    const photo =
      candidate.photo_url
      ? `<img src="${escapeHtml(candidate.photo_url)}">`
      : `<div style="height:210px;background:#eee;border-radius:10px;display:flex;align-items:center;justify-content:center;">
          Aucune photo
         </div>`;


    card.innerHTML = `

      ${photo}

      <h3>
        ${escapeHtml(candidate.nom_prenom || "")}
      </h3>

      <p>
        <strong>Profession :</strong><br>
        ${escapeHtml(candidate.profession || "Non renseignée")}
      </p>

      <p>
        <strong>Programme :</strong><br>
        ${escapeHtml(candidate.programme || "Non renseigné")}
      </p>

      <p>
        <strong>Ambitions :</strong><br>
        ${escapeHtml(candidate.ambition || "Non renseignées")}
      </p>

      <button
        class="secondary"
        onclick="editCandidate('${candidate.id}')"
      >
        Modifier
      </button>

      <button
        class="danger"
        onclick="deleteCandidate('${candidate.id}')"
      >
        Supprimer
      </button>

    `;


    list.appendChild(card);

  });

}


/* =====================================================
   AJOUTER / MODIFIER
===================================================== */

document.getElementById("candidateForm")
  .addEventListener("submit", async function(e) {

    e.preventDefault();


    const now = new Date();
    const debut =
      new Date(electionConfig.date_debut);


    if (now >= debut) {

      alert(
        "🔒 La gestion des candidats est verrouillée."
      );

      return;
    }


    const name =
      document.getElementById("candidateName")
        .value.trim();

    const profession =
      document.getElementById("candidateProfession")
        .value.trim();

    const programme =
      document.getElementById("candidateProgramme")
        .value.trim();

    const ambition =
      document.getElementById("candidateAmbition")
        .value.trim();

    const photo =
      document.getElementById("candidatePhoto");


    if (!name) {

      alert("Le nom et prénom sont obligatoires.");

      return;
    }


    const saveButton =
      document.getElementById("saveButton");

    saveButton.disabled = true;


    try {

      let photoUrl = null;


      /* UPLOAD PHOTO */

      if (photo.files.length > 0) {

        const file =
          photo.files[0];

        const extension =
          file.name.split(".").pop();

        const filename =
          crypto.randomUUID() +
          "." +
          extension;


        const upload =
          await db.storage
            .from("candidats_photos")
            .upload(
              filename,
              file
            );


        if (upload.error) {
          throw upload.error;
        }


        const publicUrl =
          db.storage
            .from("candidats_photos")
            .getPublicUrl(filename);


        photoUrl =
          publicUrl.data.publicUrl;

      }


      /* MODIFICATION */

      if (editingId) {

        const updateData = {

          nom_prenom: name,

          profession:
            profession || null,

          programme:
            programme || null,

          ambition:
            ambition || null

        };


        if (photoUrl) {

          updateData.photo_url =
            photoUrl;

        }


        const { error } =
          await db
            .from("candidats")
            .update(updateData)
            .eq("id", editingId);


        if (error) {
          throw error;
        }


        alert("✅ Candidat modifié.");

      }


      /* AJOUT */

      else {

        const { error } =
          await db
            .from("candidats")
            .insert({

              nom_prenom: name,

              photo_url:
                photoUrl,

              profession:
                profession || null,

              programme:
                programme || null,

              ambition:
                ambition || null

            });


        if (error) {
          throw error;
        }


        alert("✅ Candidat ajouté.");

      }


      resetForm();

      await loadCandidates();

      await loadStats();


    } catch(error) {

      alert(
        "❌ " +
        (error.message ||
         "Erreur lors de l'opération.")
      );

    }


    saveButton.disabled = false;

  });


/* =====================================================
   MODIFIER
===================================================== */

window.editCandidate =
async function(id) {

  const now = new Date();

  const debut =
    new Date(electionConfig.date_debut);


  if (now >= debut) {

    alert(
      "🔒 La gestion des candidats est verrouillée."
    );

    return;
  }


  const { data, error } =
    await db
      .from("candidats")
      .select("*")
      .eq("id", id)
      .single();


  if (error) {

    alert("❌ Candidat introuvable.");

    return;
  }


  editingId = id;


  document.getElementById("candidateName")
    .value =
    data.nom_prenom || "";

  document.getElementById("candidateProfession")
    .value =
    data.profession || "";

  document.getElementById("candidateProgramme")
    .value =
    data.programme || "";

  document.getElementById("candidateAmbition")
    .value =
    data.ambition || "";


  document.getElementById("saveButton")
    .textContent =
    "MODIFIER LE CANDIDAT";


  document.getElementById("cancelButton")
    .classList.remove("hidden");


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

};


/* =====================================================
   SUPPRIMER
===================================================== */

window.deleteCandidate =
async function(id) {

  const now = new Date();

  const debut =
    new Date(electionConfig.date_debut);


  if (now >= debut) {

    alert(
      "🔒 La gestion des candidats est verrouillée."
    );

    return;
  }


  if (!confirm(
    "Voulez-vous vraiment supprimer ce candidat ?"
  )) {

    return;
  }


  const { error } =
    await db
      .from("candidats")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "❌ " + error.message
    );

    return;
  }


  alert("✅ Candidat supprimé.");

  await loadCandidates();

  await loadStats();

};


/* =====================================================
   ANNULER MODIFICATION
===================================================== */

document.getElementById("cancelButton")
  .onclick = function() {

    resetForm();

  };


function resetForm() {

  editingId = null;

  document.getElementById("candidateForm")
    .reset();

  document.getElementById("saveButton")
    .textContent =
    "AJOUTER LE CANDIDAT";

  document.getElementById("cancelButton")
    .classList.add("hidden");

}


/* =====================================================
   PROTECTION AFFICHAGE
===================================================== */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =====================================================
   DÉMARRAGE
===================================================== */

async function startAdmin() {

  await loadElectionConfig();

  await loadCandidates();

  await loadStats();

}


startAdmin();


/* =====================================================
   ACTUALISATION AUTOMATIQUE
===================================================== */

setInterval(async function() {

  await loadElectionConfig();

  await loadStats();

}, 10000);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Administration</title>
</head>

<body>

  <h1>Test connexion administrateur</h1>

  <div id="message" style="
    padding:20px;
    margin:20px;
    background:#f1f1f1;
    border-radius:10px;
    font-size:18px;
  ">
    Chargement du test...
  </div>

  <input
    id="email"
    type="email"
    placeholder="E-mail"
    style="padding:12px; display:block; margin:10px;"
  >

  <input
    id="password"
    type="password"
    placeholder="Mot de passe"
    style="padding:12px; display:block; margin:10px;"
  >

  <button
    id="login"
    style="padding:12px 20px; margin:10px;"
  >
    TESTER LA CONNEXION
  </button>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const message =
  document.getElementById("message");


/* TEST 1 : JavaScript */

message.textContent =
  "✅ JavaScript fonctionne. Vérification de Supabase...";


/* TEST 2 : bibliothèque Supabase */

if (!window.supabase) {

  message.textContent =
    "❌ ERREUR : la bibliothèque Supabase ne se charge pas.";

} else {

  message.textContent =
    "✅ Supabase est chargé. Vérification de la connexion...";


  try {

    const SUPABASE_URL =
      "https://qktfqpsqmcrgtmauntfj.supabase.co";


    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXAiLCJyZWYiOiJxa3RmcXBzcW1jcmd0bWF1bnRqIiwiaWF0IjoxNzkwOTc1NTAxLCJleHAiOjIxMDY1NTE1MDF9.sugP-f143dYuyUzY8FHZqTS-YuuM3JcGX4tLz2N_kuI";


    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    message.textContent =
      "✅ Supabase est prêt. Tu peux tester la connexion.";


    document
      .getElementById("login")
      .addEventListener(
        "click",
        async function() {

          message.textContent =
            "⏳ Connexion en cours...";


          const email =
            document
              .getElementById("email")
              .value
              .trim();


          const password =
            document
              .getElementById("password")
              .value;


          if (!email || !password) {

            message.textContent =
              "❌ Entre l'e-mail et le mot de passe.";

            return;

          }


          try {

            const result =
              await db.auth.signInWithPassword({

                email: email,

                password: password

              });


            if (result.error) {

              message.textContent =
                "❌ Supabase répond : " +
                result.error.message;

              return;

            }


            message.textContent =
              "✅ CONNEXION RÉUSSIE !";

          }

          catch(error) {

            message.textContent =
              "❌ Erreur : " +
              error.message;

          }

        }
      );

  }

  catch(error) {

    message.textContent =
      "❌ Erreur lors du démarrage de Supabase : " +
      error.message;

  }

}

</script>

</body>
</html>

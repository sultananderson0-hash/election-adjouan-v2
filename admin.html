<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Administration</title>
</head>

<body>

  <h1>Administration — Élection Président des Jeunes</h1>

  <div id="status">Chargement de Supabase...</div>

  <br>

  <input
    type="email"
    id="email"
    placeholder="Adresse e-mail"
  >

  <br><br>

  <input
    type="password"
    id="password"
    placeholder="Mot de passe"
  >

  <br><br>

  <button id="loginBtn">Se connecter</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://qktfqpsqmcrgtmauntfj.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdGZxcHNxbWNyZ3RtYXVudGZqIiwiaWF0IjoxNzkwOTc1NTAxLCJleHAiOjIxMDY1NTE1MDF9.sugP-f143dYuyUzY8FHZqTS-YuuM3JcGX4tLz2N_kuI";

    const status = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");

    if (!window.supabase) {

      status.textContent =
        "❌ La bibliothèque Supabase ne se charge pas.";

    } else {

      const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

      status.textContent =
        "✅ Supabase est prêt. Tu peux tester la connexion.";

      loginBtn.addEventListener("click", async () => {

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        if (!email || !password) {

          status.textContent =
            "⚠️ Entre ton e-mail et ton mot de passe.";

          return;
        }

        status.textContent =
          "⏳ Connexion en cours...";

        const { data, error } =
          await db.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {

          status.textContent =
            "❌ " + error.message;

          console.error(error);

          return;
        }

        status.textContent =
          "✅ Connexion réussie !";

        console.log("Utilisateur connecté :", data.user);

      });

    }

  </script>

</body>
</html>
